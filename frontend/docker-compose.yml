# =============================================================================
# docker-compose.yml — Frontend (Pasinfo Portal)
# Enterprise Grade — Least Privilege & Production Hardened
# =============================================================================
name: pasinfo-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/raflyherdianto/pasinfo-frontend:latest

    container_name: pasinfo-frontend

    # ── Principle of Least Privilege: Dedicated unprivileged NGINX UID:GID ─────
    user: "101:101"

    # ── Process Init & Lifecycle Management ────────────────────────────────────
    init: true
    restart: unless-stopped

    environment:
      NGINX_PORT: "8080"

    # ── Security & Capability Hardening ───────────────────────────────────────
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # NGINX unprivileged template expects these writable paths
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=16m,mode=0755

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Watchtower Auto-Deploy Labels ─────────────────────────────────────────
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      org.opencontainers.image.title: "pasinfo-frontend"
      org.opencontainers.image.description: "Pasinfo Frontend Portal Service"
      org.opencontainers.image.source: "https://github.com/raflyherdianto/pasinfo"

    # ── Resource Limits & Protection ──────────────────────────────────────────
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
        reservations:
          cpus: "0.05"
          memory: "64M"

    # ── Logging Constraints ───────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

    networks:
      - shared-network

# =============================================================================
# Named volumes and networks
# =============================================================================
networks:
  shared-network:
    name: shared-network
    external: true
