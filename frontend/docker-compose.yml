# =============================================================================
# docker-compose.yml — Frontend (Pasinfo Portal)
# Production deployment on Oracle Cloud ARM VM
# =============================================================================

version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pasinfo-frontend:latest

    container_name: pasinfo-frontend

    restart: unless-stopped

    environment:
      NGINX_PORT: "8080"

    # ── Security: container hardening ─────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # NGINX unprivileged template expects these writable paths
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=16m,mode=0755

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Resource limits ───────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
        reservations:
          memory: "64M"

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true
