server {
    listen       8080;
    server_name  pasinfo.com www.pasinfo.com;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types
        text/plain text/css application/json
        application/javascript text/xml application/xml
        application/xml+rss text/javascript image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header X-Frame-Options          "DENY"                              always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.pasinfo.com https://wilayah.id; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';" always;

    # ── SPA routing — fallback to index.html ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Immutable static assets (Vite hashes filenames) ───────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── JSON/manifest files — short cache ─────────────────────────────────────
    location ~* \.(json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ── Deny access to dotfiles and hidden paths ──────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Deny access to sensitive file types ───────────────────────────────────
    location ~* \.(env|log|sh|bak|sql|sqlite|db)$ {
        deny all;
        return 404;
    }

    # ── Limit request methods to GET and HEAD only (static site) ─────────────
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$ ) {
        return 405;
    }

    # ── Server tokens — hide NGINX version ───────────────────────────────────
    server_tokens off;
}
