# =============================================================================
# GitHub Actions — Frontend CI/CD (Local Build on VM)
# Trigger: any push to main that touches frontend/** files
# =============================================================================

name: "🚀 Deploy Frontend"

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DIR: ~/pasinfo/frontend

jobs:
  deploy:
    name: "Deploy to VM (Build Local)"
    runs-on: ubuntu-latest

    environment:
      name: production-frontend

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📁 Copy frontend files to VM"
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_KEY }}
          source:   "frontend/**"
          target:   "~/pasinfo"

      - name: "🚢 SSH — build and restart frontend service"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_KEY }}
          timeout:  450s
          script: |
            set -euo pipefail

            echo "=== Creating directories & files ==="
            mkdir -p ~/pasinfo/frontend
            touch ~/pasinfo/frontend/.env

            echo "=== Building and restarting frontend service via Docker Compose ==="
            cd ~/pasinfo/frontend
            docker compose up -d --build --remove-orphans

            echo "=== Waiting for health check (max 60s) ==="
            timeout 60 sh -c \
              'until docker inspect --format="{{.State.Health.Status}}" pasinfo-frontend | grep -q "healthy"; do sleep 3; done'

            echo "=== Pruning unused images & build cache ==="
            docker image prune -f

            echo "=== Deployment complete ==="
