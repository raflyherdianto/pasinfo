# =============================================================================
# GitHub Actions — Backend CI/CD (Local Build on VM)
# Trigger: any push to main that touches backend/** files
# =============================================================================

name: "🚀 Deploy Backend"

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DIR: ~/pasinfo/backend

jobs:
  deploy:
    name: "Deploy to VM (Build Local)"
    runs-on: ubuntu-latest

    environment:
      name: production-backend

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📁 Copy backend files to VM"
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_KEY }}
          source:   "backend/**"
          target:   "~/pasinfo"

      - name: "🚢 SSH — build and restart backend service"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_KEY }}
          timeout:  300s
          script: |
            set -euo pipefail

            echo "=== Creating directories & files ==="
            mkdir -p ~/pasinfo/backend/data ~/pasinfo/backend/uploads/images
            touch ~/pasinfo/backend/.env

            echo "=== Building and restarting backend service via Docker Compose ==="
            cd ~/pasinfo/backend
            docker compose up -d --build --remove-orphans

            echo "=== Waiting for health check (max 60s) ==="
            timeout 60 sh -c \
              'until docker inspect --format="{{.State.Health.Status}}" pasinfo-backend | grep -q "healthy"; do sleep 3; done'

            echo "=== Pruning unused images & build cache ==="
            docker image prune -f

            echo "=== Deployment complete ==="
