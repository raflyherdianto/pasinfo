# =============================================================================
# GitHub Actions — Backend CI/CD
# Trigger: any push to main that touches backend/** files
#
# Secrets required (repo → Settings → Secrets):
#   VM_HOST     : IP address or hostname of the Oracle ARM VM
#   VM_USER     : SSH username (e.g. ubuntu / opc)
#   VM_PASSWORD : SSH password (prefer key-based auth in production)
# =============================================================================

name: "🚀 Deploy Backend"

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true   # Cancel any in-progress run if a new push arrives

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository_owner }}/pasinfo-backend
  COMPOSE_DIR: ~/pasinfo/backend

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Push Docker image to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # Required to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: "⬇️  Checkout repository"
        uses: actions/checkout@v4

      # Set up QEMU for cross-platform ARM64 builds on x86 runner
      - name: "🔧 Set up QEMU (ARM64 emulation)"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags & labels from git metadata
      - name: "🏷️  Extract image metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "🐳 Build & push (linux/arm64)"
        id: push
        uses: docker/build-push-action@v6
        with:
          context:   ./backend
          file:      ./backend/Dockerfile
          platforms: linux/arm64
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up layer reuse
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          provenance: false   # Disable provenance for simpler manifest

  # ---------------------------------------------------------------------------
  # Job 2: Deploy the new image to the Oracle ARM VM via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy to VM"
    runs-on: ubuntu-latest
    needs: build-and-push

    environment:
      name: production-backend
      url: http://${{ secrets.VM_HOST }}:8080

    steps:
      - name: "🚢 SSH — pull latest image and restart service"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_KEY }}
          timeout:  120s
          script: |
            set -euo pipefail

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling latest backend image ==="
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "=== Restarting service via Docker Compose ==="
            docker compose \
              -f ${{ env.COMPOSE_DIR }}/docker-compose.yml \
              up -d --remove-orphans

            echo "=== Waiting for health check (max 60s) ==="
            timeout 60 sh -c \
              'until docker inspect --format="{{.State.Health.Status}}" pasinfo-backend | grep -q "healthy"; do sleep 3; done'

            echo "=== Pruning dangling and unused images ==="
            docker image prune -f

            echo "=== Deployment complete ==="
