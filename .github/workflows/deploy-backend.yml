# =============================================================================
# GitHub Actions — Backend CI/CD (Build & Push to GHCR)
# Watchtower on Host VM will automatically pull and deploy the new image
# =============================================================================

name: "🚀 Build & Push Backend to GHCR"

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: "Build & Push Backend Image"
    runs-on: ubuntu-latest

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Extract Metadata (tags, labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pasinfo-backend
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=,format=short

      - name: "🐳 Build and Push Backend Docker Image"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
