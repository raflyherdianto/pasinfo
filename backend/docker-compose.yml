# =============================================================================
# docker-compose.yml — Backend (Pasinfo API)
# Production deployment on Oracle Cloud ARM VM
#
# Pre-requisite on VM:
#   1. Create ~/pasinfo/backend/.env (copy from .env.example)
#   2. docker compose -f ~/pasinfo/backend/docker-compose.yml up -d
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pasinfo-backend:latest

    container_name: pasinfo-backend

    restart: unless-stopped

    # ── Environment ────────────────────────────────────────────────────────────
    # .env is created MANUALLY on the VM — never stored in repository
    env_file:
      - .env

    # Explicit env overrides to enforce security defaults
    environment:
      APP_ENV: production
      HTTPS: "true"

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      # SQLite database file — persisted outside container
      - pasinfo-db:/app/data
      # Uploaded images — persisted outside container, served by frontend NGINX
      - pasinfo-uploads:/app/uploads

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ── Security: container hardening ─────────────────────────────────────────
    security_opt:
      - no-new-privileges:true   # Prevent privilege escalation via setuid binaries
    read_only: true              # Root filesystem is read-only
    tmpfs:
      - /tmp:size=64m,mode=1777  # Temp space for Go runtime (read_only bypass)

    # ── Resource limits ───────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: "512M"
        reservations:
          memory: "128M"

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - shared-network

# =============================================================================
# Named volumes and networks
# =============================================================================
volumes:
  pasinfo-db:
    driver: local
  pasinfo-uploads:
    driver: local

networks:
  shared-network:
    name: shared-network
    external: true
