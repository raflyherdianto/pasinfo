# =============================================================================
# docker-compose.yml — Backend (Pasinfo API)
# Enterprise Grade — Least Privilege & Production Hardened
# =============================================================================
name: pasinfo-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/raflyherdianto/pasinfo-backend:latest

    container_name: pasinfo-backend

    # ── Principle of Least Privilege: Dedicated non-root UID:GID ──────────────
    user: "10001:10001"

    # ── Process Init & Lifecycle Management ────────────────────────────────────
    init: true
    restart: unless-stopped

    # ── Environment ────────────────────────────────────────────────────────────
    env_file:
      - .env

    environment:
      APP_ENV: production
      HTTPS: "true"

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      # Uploaded images — persisted outside container, served by NGINX
      - pasinfo-uploads:/app/uploads

    # ── Security & Capability Hardening ───────────────────────────────────────
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755

    # ── Resource Limits & Protection ──────────────────────────────────────────
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: "512M"
        reservations:
          cpus: "0.10"
          memory: "128M"

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ── Watchtower Auto-Deploy Labels ─────────────────────────────────────────
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      org.opencontainers.image.title: "pasinfo-backend"
      org.opencontainers.image.description: "Pasinfo Backend API Service"
      org.opencontainers.image.source: "https://github.com/raflyherdianto/pasinfo"

    # ── Logging Constraints ───────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    networks:
      - shared-network

# =============================================================================
# Named volumes and networks
# =============================================================================
volumes:
  pasinfo-uploads:
    driver: local

networks:
  shared-network:
    name: shared-network
    external: true
